name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Selecting Xcode version..."
          if [ -d "/Applications/Xcode_15.2.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_15.2.app
          elif [ -d "/Applications/Xcode_15.1.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_15.1.app
          elif [ -d "/Applications/Xcode_15.0.1.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_15.0.1.app
          fi
          xcodebuild -version

      - name: Prepare Configuration File
        run: |
          if [ ! -f "DailyPulse/DailyPulse/GoogleService-Info.plist" ]; then
            echo "Copying template GoogleService-Info.plist..."
            cp DailyPulse/DailyPulse/GoogleService-Info.plist.template DailyPulse/DailyPulse/GoogleService-Info.plist
          fi

      - name: Cache Swift Package Manager Dependencies
        uses: actions/cache@v4
        with:
          path: |
            DailyPulse/build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('DailyPulse/DailyPulse.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Packages
        run: |
          cd DailyPulse
          echo "Resolving Firebase dependencies (this can take several minutes on initial download)..."
          xcodebuild -resolvePackageDependencies \
            -project DailyPulse.xcodeproj \
            -scheme DailyPulse \
            -clonedSourcePackagesDirPath ./build/SourcePackages

      - name: Build iOS Application (Unsigned)
        run: |
          cd DailyPulse
          echo "Compiling DailyPulse iOS target..."
          xcodebuild clean build \
            -project DailyPulse.xcodeproj \
            -scheme DailyPulse \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath ./build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="../build"

      - name: Package into IPA
        run: |
          echo "Packaging Payload into DailyPulse.ipa..."
          mkdir -p Payload
          cp -r build/Release-iphoneos/DailyPulse.app Payload/
          zip -r DailyPulse.ipa Payload
          ls -lh DailyPulse.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyPulse-iOS-IPA
          path: DailyPulse.ipa
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "DailyPulse iOS v1.0.0 (IPA Release)"
          body: "Automated release containing the standalone unsigned `DailyPulse.ipa` package built for iOS."
          files: DailyPulse.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
