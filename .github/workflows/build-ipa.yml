name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_15.2.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_15.2.app
          elif [ -d "/Applications/Xcode_15.1.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_15.1.app
          elif [ -d "/Applications/Xcode_15.0.1.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_15.0.1.app
          fi
          xcodebuild -version

      - name: Prepare Configuration File
        run: |
          if [ ! -f "DailyPulse/DailyPulse/GoogleService-Info.plist" ]; then
            cp DailyPulse/DailyPulse/GoogleService-Info.plist.template DailyPulse/DailyPulse/GoogleService-Info.plist
          fi

      - name: Resolve Swift Package Manager Dependencies
        run: |
          cd DailyPulse
          xcodebuild -resolvePackageDependencies -project DailyPulse.xcodeproj -scheme DailyPulse

      - name: Build iOS Application (Unsigned)
        run: |
          cd DailyPulse
          xcodebuild clean build \
            -project DailyPulse.xcodeproj \
            -scheme DailyPulse \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="../build"

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/DailyPulse.app Payload/
          zip -r DailyPulse.ipa Payload
          ls -lh DailyPulse.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyPulse-iOS-IPA
          path: DailyPulse.ipa
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "DailyPulse iOS v1.0.0 (IPA Release)"
          body: "Automated release containing the standalone unsigned `DailyPulse.ipa` package built for iOS."
          files: DailyPulse.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
